<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HMIS - Patient Registration</title>

    <link rel="stylesheet" href="../style.css">

    <script src="../script.js" defer></script>

</head>

<body>

<header>

    <div class="logo">
        🏥 HMIS
    </div>

    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="patient-login.html">
            Login
        </a>

    </nav>

</header>


<main>

    <div class="card">

        <h1>
            Patient Registration
        </h1>

        <p>
            Create your patient account.
        </p>


        <form id="registrationForm">


            <!-- FULL NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter full name"
                required
            >


            <!-- PHONE -->

            <label for="phone">
                Phone Number
            </label>

            <input
                id="phone"
                name="phone"
                type="tel"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="10 digit phone number"
                required
            >


            <!-- DATE OF BIRTH -->

            <label for="dob">
                Date of Birth
            </label>

            <input
                id="dob"
                name="dob"
                type="date"
                required
            >


            <!-- GENDER -->

            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                minlength="6"
                placeholder="Minimum 6 characters"
                required
            >


            <!-- ERROR -->

            <p
                class="err"
                id="registrationError">
            </p>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="m">

            Already have an account?

            <a href="patient-login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script>

document
    .getElementById("registrationForm")
    .addEventListener("submit", function(event) {

        register(event);

    });

</script>

</body>

</html>
