<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMIS</title><link rel="stylesheet" href="../style.css"><script src="../script.js"></script></head><body><header></header><main><div class="card"><h1>Register</h1><form onsubmit="register(event)"><label>Full name</label><input name="name" required><label>Phone</label><input name="phone" pattern="[0-9]{10}" title="10 digits" required><label>Date of birth</label><input name="dob" type="date" required><label>Gender</label><select name="gender"><option>Female</option><option>Male</option><option>Other</option></select><label>Password</label><input name="password" type="password" minlength="6" required><p class="err" id="err"></p><button>Create account</button></form></div></main></body></html>
