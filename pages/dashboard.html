<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HMIS - Dashboard</title>

    <link rel="stylesheet" href="../style.css">

    <script src="../script.js" defer></script>

</head>

<body>

<header>

    <div class="logo">
        🏥 HMIS
    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="appointment.html">
            Appointment
        </a>

        <a href="case-summary.html">
            Case Summary
        </a>

        <a href="prescription.html">
            Prescription
        </a>

        <a href="billing.html">
            Billing
        </a>

        <a href="../index.html">
            Logout
        </a>

    </nav>

</header>


<main>

    <!-- WELCOME -->

    <div class="card">

        <h1 id="welcome">
            Welcome
        </h1>

        <p>
            Welcome to your Hospital Management Information System.
        </p>

    </div>


    <!-- QUICK ACTIONS -->

    <div class="card">

        <h2>
            Quick Actions
        </h2>


        <div class="grid">

            <a
                class="button"
                href="appointment.html">

                📅
                <br>

                Book Appointment

            </a>


            <a
                class="button"
                href="case-summary.html">

                📋
                <br>

                Case Summary

            </a>


            <a
                class="button"
                href="prescription.html">

                💊
                <br>

                Prescription

            </a>


            <a
                class="button"
                href="billing.html">

                💳
                <br>

                Billing

            </a>

        </div>

    </div>


    <!-- APPOINTMENTS -->

    <div class="card">

        <h2>
            Your Appointments
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        Appointment ID
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Department
                    </th>

                    <th>
                        Time
                    </th>

                    <th>
                        Payment
                    </th>

                </tr>

            </thead>


            <tbody id="appointmentTable">

                <tr>

                    <td colspan="5">
                        No appointments yet.
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

document.addEventListener("DOMContentLoaded", function() {

    loadDashboard();

});

</script>

</body>
</html>
